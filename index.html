    <!-- Branded Instant Preloader -->
    <div id="iamtechni-preloader" aria-hidden="true">
      <style>
        #iamtechni-preloader {
          position: fixed;
          inset: 0;
          z-index: 99999;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: #ffffff;
          opacity: 1;
          visibility: visible;
          transition: opacity 220ms ease, visibility 220ms ease;
          pointer-events: auto;
        }
        #iamtechni-preloader.iamtechni-preloader-hidden {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
        .iamtechni-preloader-content {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 20px;
          padding: 24px;
        }
        .iamtechni-preloader-logo-wrap {
          display: block;
          width: 240px;
          max-width: 80vw;
          height: auto;
          animation: iamtechni-pulse 1.8s ease-in-out infinite;
        }
        .iamtechni-preloader-img {
          display: block;
          width: 100%;
          height: auto;
          object-fit: contain;
        }
        .iamtechni-preloader-track {
          width: 160px;
          height: 3px;
          background-color: #e2e8f0;
          border-radius: 9999px;
          overflow: hidden;
          position: relative;
        }
        .iamtechni-preloader-bar {
          position: absolute;
          top: 0;
          bottom: 0;
          left: -40%;
          width: 40%;
          background: linear-gradient(90deg, #1266e8 0%, #7c3aed 100%);
          border-radius: 9999px;
          animation: iamtechni-slide 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes iamtechni-pulse {
          0%, 100% {
            opacity: 0.92;
            transform: scale(0.99);
          }
          50% {
            opacity: 1;
            transform: scale(1.02);
          }
        }
        @keyframes iamtechni-slide {
          0% {
            left: -40%;
            width: 30%;
          }
          50% {
            left: 35%;
            width: 50%;
          }
          100% {
            left: 100%;
            width: 30%;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          .iamtechni-preloader-logo-wrap,
          .iamtechni-preloader-bar {
            animation: none !important;
          }
          .iamtechni-preloader-bar {
            left: 0;
            width: 100%;
          }
        }
      </style>
      <div class="iamtechni-preloader-content">
        <picture class="iamtechni-preloader-logo-wrap">
          <source srcset="/preloader-logo.webp" type="image/webp" />
          <img
            src="/preloader-logo.png"
            alt="IAMTECHNI"
            width="240"
            height="76"
            class="iamtechni-preloader-img"
          />
        </picture>
        <div class="iamtechni-preloader-track">
          <div class="iamtechni-preloader-bar"></div>
        </div>
      </div>
      <script>
        (function() {
          window.__preloaderStartTime = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
          var t = setTimeout(function() {
            var el = document.getElementById('iamtechni-preloader');
            if (el) {
              el.classList.add('iamtechni-preloader-hidden');
              setTimeout(function() {
                if (el && el.parentNode) {
                  el.parentNode.removeChild(el);
                }
              }, 220);
            }
          }, 2500);
          window.__clearPreloaderFallbackTimer = function() {
            clearTimeout(t);
          };
        })();
      </script>
